[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- Segurança ---------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = """
      default-src 'self'; \
      base-uri 'self'; \
      form-action 'self'; \
      frame-ancestors 'none'; \
      object-src 'none'; \
      img-src 'self' data: https://i.scdn.co https://image-cdn-ak.spotifycdn.com https://image-cdn-fa.spotifycdn.com; \
      style-src 'self' 'unsafe-inline'; \
      script-src 'self'; \
      font-src 'self'; \
      frame-src https://open.spotify.com; \
      connect-src 'self' https://ltdmndehucnjnhdohvrz.supabase.co; \
      upgrade-insecure-requests"""

# --- Cache -------------------------------------------------------------------
# Assets com hash no nome podem ser imutáveis; HTML nunca.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Redirects ---------------------------------------------------------------
# Rotas antigas do site em Eleventy, preservadas para não perder ranking nem links.

[[redirects]]
  from = "/feed"
  to = "/rss.xml"
  status = 301

[[redirects]]
  from = "/feed.xml"
  to = "/rss.xml"
  status = 301

[[redirects]]
  from = "/tags/*"
  to = "/generos/"
  status = 301

[[redirects]]
  from = "/search-index.json"
  to = "/busca.json"
  status = 301
